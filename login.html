<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
</head>
<body>
  <nav style="text-align: right;">
    <a href="nova-transação.html">Criar conta</a>
  </nav>
  <main>
    <h1>Login</h1>
    <form>
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" autocomplete="username" placeholder="Digite seu nome">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" placeholder="Digite seu email">

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" placeholder="Digite sua senha">

      <button type="submit">Logar</button>
    </form>
  </main>
</body>
</html>
