<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #fff;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(90vw, 22rem);
      padding: 1rem;
      border: 2px solid #f28c28;
      border-radius: 0.85rem;
      background: #242424;
      box-shadow: 0 0.75rem 2rem #0008;
    }

    h1 {
      margin: 0 0 0.75rem;
      color: #f5f5f5;
      text-align: center;
      font-size: 1.1rem;
    }

    form {
      display: grid;
      gap: 0.75rem;
    }

    #visor {
      width: 100%;
      min-height: 3.25rem;
      padding: 0.5rem 0.75rem;
      border: 2px solid #f28c28;
      border-radius: 0.75rem;
      background: #111;
      color: #fff;
      font-size: clamp(2.25rem, 10vw, 3rem);
      font-weight: 700;
      text-align: right;
    }

    .teclado {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }

    button {
      min-height: 2.75rem;
      border: 0;
      border-radius: 0.55rem;
      background: #373737;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
    }

    button:hover {
      background: #4a4a4a;
    }

    button:focus-visible {
      outline: 3px solid #ffb45e;
      outline-offset: 2px;
    }

    button[data-action="operator"] {
      background: #a95512;
      color: #fff;
      font-weight: 700;
    }

    button[data-action="equals"] {
      background: #ff941f;
      color: #171717;
      font-size: 1.5rem;
      font-weight: 700;
      box-shadow: 0 0.3rem 0.75rem #ff941f66;
    }

    button[data-action="equals"]:hover {
      background: #ffad4d;
    }

    button[data-action="clear"],
    button[data-action="clear-entry"] {
      background: #663322;
      color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Calculadora</h1>
    <form id="calculadora" autocomplete="off">
      <input type="text" id="visor" value="0" aria-label="Resultado" readonly>
      <div class="teclado">
        <button type="button" data-action="clear">C</button>
        <button type="button" data-action="clear-entry">CE</button>
        <button type="button" data-action="percent">%</button>
        <button type="button" data-action="operator" data-operator="/">÷</button>

        <button type="button" data-action="digit" data-digit="7">7</button>
        <button type="button" data-action="digit" data-digit="8">8</button>
        <button type="button" data-action="digit" data-digit="9">9</button>
        <button type="button" data-action="operator" data-operator="*">×</button>

        <button type="button" data-action="digit" data-digit="4">4</button>
        <button type="button" data-action="digit" data-digit="5">5</button>
        <button type="button" data-action="digit" data-digit="6">6</button>
        <button type="button" data-action="operator" data-operator="-">−</button>

        <button type="button" data-action="digit" data-digit="1">1</button>
        <button type="button" data-action="digit" data-digit="2">2</button>
        <button type="button" data-action="digit" data-digit="3">3</button>
        <button type="button" data-action="operator" data-operator="+">+</button>

        <button type="button" data-action="sign">±</button>
        <button type="button" data-action="digit" data-digit="0">0</button>
        <button type="button" data-action="decimal">.</button>
        <button type="button" data-action="equals">=</button>
      </div>
    </form>
  </main>
  <script>
    const calculator = document.getElementById("calculadora");
    const display = document.getElementById("visor");
    let storedValue = null;
    let pendingOperator = null;
    let startNewEntry = false;

    function showResult(value) {
      if (!Number.isFinite(value)) {
        display.value = "Erro";
        storedValue = null;
        pendingOperator = null;
        startNewEntry = true;
        return;
      }

      display.value = String(Number(value.toPrecision(12)));
    }

    function calculate(first, second, operator) {
      switch (operator) {
        case "+":
          return first + second;
        case "-":
          return first - second;
        case "*":
          return first * second;
        case "/":
          return first / second;
        default:
          return second;
      }
    }

    calculator.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const { action, digit, operator } = button.dataset;

      if (action === "clear") {
        display.value = "0";
        storedValue = null;
        pendingOperator = null;
        startNewEntry = false;
      } else if (action === "clear-entry") {
        display.value = "0";
        startNewEntry = false;
      } else if (action === "digit") {
        if (startNewEntry || display.value === "Erro") {
          display.value = digit;
          startNewEntry = false;
        } else {
          display.value = display.value === "0" ? digit : display.value + digit;
        }
      } else if (action === "decimal") {
        if (startNewEntry || display.value === "Erro") {
          display.value = "0.";
          startNewEntry = false;
        } else if (!display.value.includes(".")) {
          display.value += ".";
        }
      } else if (action === "sign" && display.value !== "Erro") {
        display.value = String(Number(display.value) * -1);
      } else if (action === "percent" && display.value !== "Erro") {
        showResult(Number(display.value) / 100);
      } else if (action === "operator" && display.value !== "Erro") {
        const currentValue = Number(display.value);
        if (pendingOperator && !startNewEntry) {
          showResult(calculate(storedValue, currentValue, pendingOperator));
          if (display.value === "Erro") return;
          storedValue = Number(display.value);
        } else {
          storedValue = currentValue;
        }
        pendingOperator = operator;
        startNewEntry = true;
      } else if (action === "equals" && pendingOperator && storedValue !== null) {
        showResult(calculate(storedValue, Number(display.value), pendingOperator));
        storedValue = null;
        pendingOperator = null;
        startNewEntry = true;
      }
    });

    calculator.addEventListener("submit", (event) => event.preventDefault());
  </script>
</body>
</html>
