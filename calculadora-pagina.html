<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #eef2f7;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(90vw, 24rem);
      aspect-ratio: 1;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 0.5rem 1.5rem #182b451f;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 1.5rem;
    }

    form {
      min-height: 0;
      flex: 1;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 0.75rem;
    }

    form p {
      margin: 0;
    }

    #visor {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.5rem;
      background: #f8fafc;
      color: #172033;
      font-size: 1.75rem;
      text-align: right;
    }

    table {
      width: 100%;
      height: 100%;
      table-layout: fixed;
      border-spacing: 0.4rem;
    }

    td {
      padding: 0;
    }

    button {
      width: 100%;
      height: 100%;
      min-height: 2.5rem;
      border: 0;
      border-radius: 0.5rem;
      background: #e8edf5;
      color: #172033;
      font-size: 1.1rem;
      cursor: pointer;
    }

    button:hover {
      background: #d7e0ed;
    }

    button[data-action="operator"],
    button[data-action="equals"] {
      background: #2764c5;
      color: #fff;
    }

    button[data-action="operator"]:hover,
    button[data-action="equals"]:hover {
      background: #1e4f9e;
    }

    button[data-action="clear"],
    button[data-action="clear-entry"] {
      background: #fce8e6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Calculadora</h1>
    <form id="calculadora" autocomplete="off">
      <p>
        <input type="text" id="visor" name="visor" value="0" aria-label="Entrada e resultado" readonly>
      </p>

      <table>
        <tbody>
          <tr>
            <td><button type="button" data-action="clear">C</button></td>
            <td><button type="button" data-action="clear-entry">CE</button></td>
            <td><button type="button" data-action="percent">%</button></td>
            <td><button type="button" data-action="operator" data-operator="/">÷</button></td>
          </tr>
          <tr>
            <td><button type="button" data-action="digit" data-digit="7">7</button></td>
            <td><button type="button" data-action="digit" data-digit="8">8</button></td>
            <td><button type="button" data-action="digit" data-digit="9">9</button></td>
            <td><button type="button" data-action="operator" data-operator="*">×</button></td>
          </tr>
          <tr>
            <td><button type="button" data-action="digit" data-digit="4">4</button></td>
            <td><button type="button" data-action="digit" data-digit="5">5</button></td>
            <td><button type="button" data-action="digit" data-digit="6">6</button></td>
            <td><button type="button" data-action="operator" data-operator="-">−</button></td>
          </tr>
          <tr>
            <td><button type="button" data-action="digit" data-digit="1">1</button></td>
            <td><button type="button" data-action="digit" data-digit="2">2</button></td>
            <td><button type="button" data-action="digit" data-digit="3">3</button></td>
            <td><button type="button" data-action="operator" data-operator="+">+</button></td>
          </tr>
          <tr>
            <td><button type="button" data-action="sign">±</button></td>
            <td><button type="button" data-action="digit" data-digit="0">0</button></td>
            <td><button type="button" data-action="decimal">.</button></td>
            <td><button type="button" data-action="equals">=</button></td>
          </tr>
        </tbody>
      </table>
    </form>
  </main>
  <script>
    const calculator = document.getElementById("calculadora");
    const display = document.getElementById("visor");
    let storedValue = null;
    let pendingOperator = null;
    let startNewEntry = false;

    function showResult(value) {
      if (!Number.isFinite(value)) {
        display.value = "Erro";
        storedValue = null;
        pendingOperator = null;
        startNewEntry = true;
        return;
      }

      display.value = String(Number(value.toPrecision(12)));
    }

    function calculate(first, second, operator) {
      switch (operator) {
        case "+":
          return first + second;
        case "-":
          return first - second;
        case "*":
          return first * second;
        case "/":
          return first / second;
        default:
          return second;
      }
    }

    calculator.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const { action, digit, operator } = button.dataset;

      if (action === "clear") {
        display.value = "0";
        storedValue = null;
        pendingOperator = null;
        startNewEntry = false;
      } else if (action === "clear-entry") {
        display.value = "0";
        startNewEntry = false;
      } else if (action === "digit") {
        if (startNewEntry || display.value === "Erro") {
          display.value = digit;
          startNewEntry = false;
        } else {
          display.value = display.value === "0" ? digit : display.value + digit;
        }
      } else if (action === "decimal") {
        if (startNewEntry || display.value === "Erro") {
          display.value = "0.";
          startNewEntry = false;
        } else if (!display.value.includes(".")) {
          display.value += ".";
        }
      } else if (action === "sign" && display.value !== "Erro") {
        display.value = String(Number(display.value) * -1);
      } else if (action === "percent" && display.value !== "Erro") {
        showResult(Number(display.value) / 100);
      } else if (action === "operator" && display.value !== "Erro") {
        const currentValue = Number(display.value);
        if (pendingOperator && !startNewEntry) {
          showResult(calculate(storedValue, currentValue, pendingOperator));
          if (display.value === "Erro") return;
          storedValue = Number(display.value);
        } else {
          storedValue = currentValue;
        }
        pendingOperator = operator;
        startNewEntry = true;
      } else if (action === "equals" && pendingOperator && storedValue !== null) {
        showResult(calculate(storedValue, Number(display.value), pendingOperator));
        storedValue = null;
        pendingOperator = null;
        startNewEntry = true;
      }
    });

    calculator.addEventListener("submit", (event) => event.preventDefault());
  </script>
</body>
</html>
